name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.3

      - run: go test ./...

      - run: go build ./cmd/server
